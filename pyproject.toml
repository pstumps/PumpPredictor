[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-predictor"
version = "0.1.0"
description = "ML pipeline for predicting pump-like price/volume anomalies in penny stocks"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
